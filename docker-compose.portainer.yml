# =============================================================================
# ZeroPeek – production stack for Portainer
# =============================================================================
#
#   * backend + frontend are pulled from GHCR (built and pushed by
#     .github/workflows/docker-publish.yml). No image is built on the host.
#   * PostgreSQL data lives in a named volume.
#   * Only the reverse proxy publishes a port. Everything else is reachable
#     solely through the internal `zeropeek` network.
#   * No credentials are stored in this file – everything comes from the
#     Portainer stack environment (see .env.portainer.example).
#
# Deploy:
#   Portainer -> Stacks -> Add stack -> Repository -> select this file.
#   Full instructions: docs/deployment/PORTAINER.md
#
# Rollback: set ZEROPEEK_IMAGE_TAG to a previous `sha-<short>` tag and
#   redeploy. See docs/deployment/ROLLBACK.md
# =============================================================================

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # Deterministic, reproducible collation for ordered quiz results.
      POSTGRES_INITDB_ARGS: '--encoding=UTF8 --locale=C'
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - zeropeek
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    # No published port. Uncomment only for temporary debugging from the host.
    # ports:
    #   - '${POSTGRES_PORT:-5432}:5432'

  cache:
    image: redis:7-alpine
    restart: unless-stopped
    # Small, cache-only Redis: bounded memory, no persistence. Redis is used
    # for Socket.IO scaling and rate limiting (see ADR 0003/0006); losing it
    # on restart costs nothing.
    command:
      - redis-server
      - --save
      - ''
      - --appendonly
      - 'no'
      - --maxmemory
      - ${REDIS_MAXMEMORY:-256mb}
      - --maxmemory-policy
      - allkeys-lru
    networks:
      - zeropeek
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    # ports:
    #   - '${REDIS_PORT:-6379}:6379'

  backend:
    # Pin the whole stack with ZEROPEEK_IMAGE_TAG (`latest` or `sha-<short>`).
    image: ${ZEROPEEK_BACKEND_IMAGE:-ghcr.io/dejowebdesign/zeropeek-backend}:${ZEROPEEK_IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      BACKEND_PORT: '3000'
      BACKEND_HOST: 0.0.0.0
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Public origin of the app, used for links, QR codes and cookie scope.
      APP_BASE_URL: ${APP_BASE_URL}
      # Allowed browser origin for CORS.
      CORS_ORIGIN: ${CORS_ORIGIN}
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      SESSION_SECRET: ${SESSION_SECRET}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-72}
      COOKIE_NAME: ${COOKIE_NAME:-zp_session}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
    networks:
      - zeropeek
    # The image already defines a HEALTHCHECK; this only tunes it for
    # container start ordering and Portainer's health column.
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  frontend:
    image: ${ZEROPEEK_FRONTEND_IMAGE:-ghcr.io/dejowebdesign/zeropeek-frontend}:${ZEROPEEK_IMAGE_TAG:-latest}
    restart: unless-stopped
    networks:
      - zeropeek
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://127.0.0.1:80/']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    # The only service with a published port. 80 is the default so the stack
    # works out of the box; set HTTP_PORT=443 once TLS is configured.
    ports:
      - '${HTTP_PORT:-80}:80'
    environment:
      ZP_DOMAIN: ${ZP_DOMAIN:-localhost}
    # The Caddyfile is embedded inline so the stack needs no repository
    # checkout and no host bind mounts – it is fully self-contained.
    configs:
      - source: caddy_config
        target: /etc/caddy/Caddyfile
    depends_on:
      backend:
        condition: service_started
      frontend:
        condition: service_started
    networks:
      - zeropeek
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://127.0.0.1:80/']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

configs:
  caddy_config:
    content: |
      # ZeroPeek edge proxy. Routes /api and /socket.io to the backend,
      # everything else to the static frontend. Caddy handles WebSocket
      # upgrades for Socket.IO automatically.
      #
      # TLS: to enable automatic HTTPS, replace the site address below with
      # the real domain (from $ZP_DOMAIN) and set HTTP_PORT=443. Caddy then
      # obtains and renews certificates on its own.
      {
        auto_https off
        admin off
      }

      :80 {
        encode zstd gzip

        header {
          X-Content-Type-Options "nosniff"
          X-Frame-Options "DENY"
          Referrer-Policy "no-referrer"
          Cross-Origin-Opener-Policy "same-origin"
          Permissions-Policy "camera=(), microphone=(), geolocation=()"
          -Server
        }

        @sockets path /socket.io/*
        handle @sockets {
          reverse_proxy backend:3000
        }

        @api path /api/*
        handle @api {
          reverse_proxy backend:3000
        }

        handle {
          reverse_proxy frontend:80
        }
      }

networks:
  zeropeek:
    driver: bridge

volumes:
  db-data:
