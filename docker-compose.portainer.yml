# =============================================================================
# ZeroPeek – production stack for Portainer
# =============================================================================
#
#   * backend + frontend are pulled from GHCR (built and pushed by
#     .github/workflows/docker-publish.yml). No image is built on the host.
#   * PostgreSQL data lives in a named volume.
#   * Only the reverse proxy publishes a port. Everything else is reachable
#     solely through the internal `zeropeek` network.
#   * No credentials are stored in this file – everything comes from the
#     Portainer stack environment (see .env.portainer.example).
#
# Deploy:
#   Portainer -> Stacks -> Add stack -> Repository -> select this file.
#   Full instructions: docs/deployment/PORTAINER.md
#
# Rollback: set ZEROPEEK_IMAGE_TAG to a previous `sha-<short>` tag and
#   redeploy. See docs/deployment/ROLLBACK.md
# =============================================================================

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      # `:?` makes Compose fail fast with a clear message when a value is
      # missing or empty, instead of starting PostgreSQL with an empty
      # POSTGRES_PASSWORD (which aborts initialisation and leaves the container
      # `unhealthy`). See docs/reports/postgresql-password-fix.md.
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB muss gesetzt sein}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER muss gesetzt sein}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD muss gesetzt sein}
      # Deterministic, reproducible collation for ordered quiz results.
      POSTGRES_INITDB_ARGS: '--encoding=UTF8 --locale=C'
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - zeropeek
    healthcheck:
      # `pg_isready` alone only proves the server accepts connections; it
      # succeeds even for a non-existent user or database. The `psql` probe
      # below performs a real login, so a POSTGRES_USER/DB/PASSWORD mismatch is
      # reported as `unhealthy` instead of surfacing later as a backend error.
      # The host is `$(hostname)`, not 127.0.0.1: the loopback address is
      # covered by the image's `trust` rule and would accept any password.
      # `$$` escapes the `$` so the values are read from the container env at
      # runtime rather than interpolated by Compose.
      test:
        [
          'CMD-SHELL',
          'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" && PGPASSWORD="$$POSTGRES_PASSWORD" psql -w -h "$$(hostname)" -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" -tAc "SELECT 1" >/dev/null',
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    # No published port. Uncomment only for temporary debugging from the host.
    # ports:
    #   - '${POSTGRES_PORT:-5432}:5432'

  cache:
    image: redis:7-alpine
    restart: unless-stopped
    # Small, cache-only Redis: bounded memory, no persistence. Redis is used
    # for Socket.IO scaling and rate limiting (see ADR 0003/0006); losing it
    # on restart costs nothing.
    command:
      - redis-server
      - --save
      - ''
      - --appendonly
      - 'no'
      - --maxmemory
      - ${REDIS_MAXMEMORY:-256mb}
      - --maxmemory-policy
      - allkeys-lru
    networks:
      - zeropeek
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    # ports:
    #   - '${REDIS_PORT:-6379}:6379'

  backend:
    # Pin the whole stack with ZEROPEEK_IMAGE_TAG (`latest` or `sha-<short>`).
    image: ${ZEROPEEK_BACKEND_IMAGE:-ghcr.io/dejowebdesign/zeropeek-backend}:${ZEROPEEK_IMAGE_TAG:-latest}
    # `on-failure:5` (not `unless-stopped`): the backend exits non-zero on a
    # misconfiguration or an unreachable database, so `unless-stopped` would
    # restart it forever. This policy retries a few times, then leaves the
    # container stopped and visible in Portainer instead of looping endlessly.
    # A clean exit (code 0, e.g. SIGTERM during an update) is never restarted,
    # and Docker still restarts it after a daemon/host reboot.
    restart: on-failure:5
    environment:
      NODE_ENV: production
      BACKEND_PORT: '3000'
      BACKEND_HOST: 0.0.0.0
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Public origin of the app, used for links, QR codes and cookie scope.
      # Required: the stack refuses to deploy with an empty value.
      APP_BASE_URL: ${APP_BASE_URL:?APP_BASE_URL muss gesetzt sein (z. B. https://quiz.example.com)}
      # Allowed browser origin for CORS. Defaults to APP_BASE_URL when empty.
      CORS_ORIGIN: ${CORS_ORIGIN:-}
      # Connection string consumed by Prisma. Optional: when empty it is built
      # from the POSTGRES_* values below (with URL-safe encoding), so the
      # credentials live in exactly one place. See docs/deployment/ENVIRONMENT.md.
      DATABASE_URL: ${DATABASE_URL:-}
      # Passed through so DATABASE_URL can be derived and the entrypoint can
      # diagnose connection failures. Not logged anywhere.
      POSTGRES_HOST: db
      POSTGRES_PORT: '5432'
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER muss gesetzt sein}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD muss gesetzt sein}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB muss gesetzt sein}
      # Redis connection string. OPTIONAL: it defaults to the `cache` service,
      # which is the only correct value for this stack. There is no `:?` guard on
      # purpose – requiring it only duplicated a value the stack already knows
      # and made deployments fail on a variable that is not needed (see
      # docs/reports/portainer-redis-and-acme-fix.md). Set it only when Redis runs
      # outside this stack. The backend probes it on start and logs a clear
      # warning when it is unreachable; Redis is optional, so the app still serves
      # requests.
      REDIS_URL: ${REDIS_URL:-redis://cache:6379}
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET muss gesetzt sein (openssl rand -hex 32)}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-72}
      COOKIE_NAME: ${COOKIE_NAME:-zp_session}
      # Empty (the default) derives Secure from APP_BASE_URL: `https://` marks the
      # cookie Secure, plain HTTP does not. Set it explicitly to override.
      COOKIE_SECURE: ${COOKIE_SECURE:-}
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
    networks:
      - zeropeek
    # The image already defines a HEALTHCHECK; this only tunes it for
    # container start ordering and Portainer's health column.
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  frontend:
    image: ${ZEROPEEK_FRONTEND_IMAGE:-ghcr.io/dejowebdesign/zeropeek-frontend}:${ZEROPEEK_IMAGE_TAG:-latest}
    restart: unless-stopped
    networks:
      - zeropeek
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://127.0.0.1:80/']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    # The only service with a published port. With ZP_SITE_ADDRESS empty
    # (default) Caddy serves plain HTTP on container port 80, so HTTP_PORT is
    # the public port. 3737 is the default because port 80 is commonly already
    # taken on the Docker host. For TLS set ZP_SITE_ADDRESS to the public
    # domain, CADDY_CONTAINER_PORT=443 and HTTP_PORT=443; Caddy then obtains and
    # renews certificates for that domain automatically.
    ports:
      - '${HTTP_PORT:-3737}:${CADDY_CONTAINER_PORT:-80}'
    environment:
      # Site address Caddy binds to. Empty (the default) makes the embedded
      # Caddyfile fall back to `:80` for plain HTTP. Set it to the public
      # domain (e.g. quiz.example.com) together with CADDY_CONTAINER_PORT=443
      # and HTTP_PORT=443 to enable automatic HTTPS.
      ZP_SITE_ADDRESS: ${ZP_SITE_ADDRESS:-}
      # ACME directory Caddy requests certificates from. Empty (the default)
      # uses Let's Encrypt production. Set it to the staging directory while
      # testing so a misconfiguration cannot consume the production rate limit
      # (50 certificates per registered domain per week):
      #   https://acme-staging-v02.api.letsencrypt.org/directory
      ZP_ACME_CA: ${ZP_ACME_CA:-}
    # The Caddyfile is embedded inline so the stack needs no repository
    # checkout and no host bind mounts – it is fully self-contained.
    configs:
      - source: caddy_config
        target: /etc/caddy/Caddyfile
    # Caddy keeps issued certificates and the ACME account under /data. That
    # directory MUST be a named volume: without it every container recreation
    # (image update, --force-recreate, redeploy) forgets the certificate and the
    # account and requests a new one – which is what exhausted the Let's
    # Encrypt limit ("too many certificates (50) already issued"). With the
    # volume, Caddy only requests a certificate when it actually expired.
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      backend:
        condition: service_started
      frontend:
        condition: service_started
    networks:
      - zeropeek
    healthcheck:
      # A plain TCP connect on either supported listener. In HTTP mode Caddy
      # serves on :80; in TLS mode it serves on :443 (and answers :80 with a
      # redirect), so an HTTP request would fail a TLS-mode probe. `nc -z` is
      # port-agnostic and fails as soon as Caddy is down.
      test: ['CMD-SHELL', 'nc -z 127.0.0.1 80 || nc -z 127.0.0.1 443']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

configs:
  caddy_config:
    content: |
      # ZeroPeek edge proxy. Routes /api and /socket.io to the backend,
      # everything else to the static frontend. Caddy handles WebSocket
      # upgrades for Socket.IO automatically.
      #
      # TLS: set ZP_SITE_ADDRESS to the public domain (e.g. quiz.example.com),
      # CADDY_CONTAINER_PORT=443 and HTTP_PORT=443; Caddy then obtains and
      # renews certificates for that domain automatically. With
      # ZP_SITE_ADDRESS empty the site address falls back to `:80` (plain
      # HTTP). Compose substitutes the address when the stack is deployed, so
      # both modes work from this one file.
      #
      # ACME: certificates and the account are stored in /data, which is the
      # `caddy-data` volume. ZP_ACME_CA is empty for Let's Encrypt production;
      # set it to the staging directory while testing.
      {
        admin off
        acme_ca ${ZP_ACME_CA:-https://acme-v02.api.letsencrypt.org/directory}
      }

      ${ZP_SITE_ADDRESS:-:80} {
        encode zstd gzip

        header {
          X-Content-Type-Options "nosniff"
          X-Frame-Options "DENY"
          Referrer-Policy "no-referrer"
          Cross-Origin-Opener-Policy "same-origin"
          Permissions-Policy "camera=(), microphone=(), geolocation=()"
          -Server
        }

        @sockets path /socket.io/*
        handle @sockets {
          reverse_proxy backend:3000
        }

        @api path /api/*
        handle @api {
          reverse_proxy backend:3000
        }

        handle {
          reverse_proxy frontend:80
        }
      }

networks:
  zeropeek:
    driver: bridge

volumes:
  db-data:
  # ACME certificates + account (see the proxy service).
  caddy-data:
  caddy-config:
