# ZeroPeek – continuous integration for pull requests.
#
# Scope: this workflow is the fast feedback gate for pull requests only.
# Pushes to `main` and version tags are handled by docker-publish.yml, which
# runs the exact same verification steps before it publishes any image. Keeping
# the two triggers disjoint avoids running (and paying for) the same checks
# twice for one commit.

name: CI

on:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Typecheck, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Check formatting
        run: npm run format:check

      - name: Build all workspaces
        run: npm run build
