# ZeroPeek – continuous integration for pull requests.
#
# Scope: this workflow is the fast feedback gate for pull requests only.
# Pushes to `main` and version tags are handled by docker-publish.yml, which
# runs the exact same verification steps before it publishes any image. Keeping
# the two triggers disjoint avoids running (and paying for) the same checks
# twice for one commit.

name: CI

on:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Typecheck, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    # The backend integration suites need a real PostgreSQL. They skip
    # themselves automatically when none is reachable, so this service is what
    # makes them run in CI rather than being silently skipped.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: zeropeek
          POSTGRES_PASSWORD: zeropeek
          POSTGRES_DB: zeropeek_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U zeropeek"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://zeropeek:zeropeek@localhost:5432/zeropeek_test?schema=public

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply database migrations
        run: npm run prisma:deploy -w @zeropeek/backend

      - name: Typecheck
        run: npm run typecheck

      - name: Unit and integration tests
        run: npm test

      - name: Check formatting
        run: npm run format:check

      - name: Build all workspaces
        run: npm run build
