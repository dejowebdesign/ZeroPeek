# ZeroPeek – build, verify and publish Docker images to GHCR.
#
# Trigger model (see docs/deployment/GITHUB_ACTIONS.md):
#   * pull requests            -> handled by .github/workflows/ci.yml (no image is published)
#   * push to `main`           -> verify, build, publish `sha-<short>`, `main` and `latest`
#   * push of a `v*.*.*` tag   -> verify, build, publish `sha-<short>`, semver and `latest`
#   * manual `workflow_dispatch` -> same as a push to the selected branch
#
# No image is ever pushed unless every verification step passed first.

name: Docker Publish (GHCR)

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:

# Least privilege by default; the publishing job raises `packages` to write.
permissions:
  contents: read

# Never cancel a publish half way through; queue instead.
concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ${{ github.repository_owner }}

jobs:
  # ---------------------------------------------------------------------------
  # 1. Verification gate. Nothing is built or published unless this job passes.
  # ---------------------------------------------------------------------------
  verify:
    name: Verify (typecheck, tests, format, build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: zeropeek
          POSTGRES_PASSWORD: zeropeek
          POSTGRES_DB: zeropeek_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U zeropeek"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://zeropeek:zeropeek@localhost:5432/zeropeek_test?schema=public
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply database migrations
        run: npm run prisma:deploy -w @zeropeek/backend

      - name: Typecheck
        run: npm run typecheck

      - name: Unit and integration tests
        run: npm test

      - name: Check formatting
        run: npm run format:check

      - name: Build all workspaces
        run: npm run build

  # ---------------------------------------------------------------------------
  # 2. Build and publish. Runs once per image, only after `verify` succeeded.
  # ---------------------------------------------------------------------------
  publish:
    name: Publish ${{ matrix.image }} image
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: backend
            dockerfile: docker/backend.Dockerfile
          - image: frontend
            dockerfile: docker/frontend.Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/zeropeek-${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          # Repository root: the Dockerfiles need the whole npm workspace.
          context: .
          file: ${{ matrix.dockerfile }}
          # Single-architecture build. Add linux/arm64 here (plus QEMU setup)
          # if the Portainer host is ARM-based.
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Layer cache is scoped per image so the two builds do not evict
          # each other's cache.
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          # Attestation manifests confuse some older Docker engines / proxies.
          # Provenance can be re-enabled once all Portainer hosts are modern.
          provenance: false

  # ---------------------------------------------------------------------------
  # 3. Optional automatic deployment through a Portainer stack webhook.
  #    Runs only for a successful push to `main`, only after both images are
  #    published. Skips silently when the webhook secret is not configured.
  # ---------------------------------------------------------------------------
  deploy:
    name: Trigger Portainer redeploy
    needs: publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger Portainer stack webhook
        env:
          PORTAINER_WEBHOOK_URL: ${{ secrets.PORTAINER_WEBHOOK_URL }}
        run: |
          set -u

          if [ -z "${PORTAINER_WEBHOOK_URL:-}" ]; then
            echo "PORTAINER_WEBHOOK_URL is not configured – skipping automatic deployment."
            echo "See docs/deployment/PORTAINER.md for the manual update procedure."
            exit 0
          fi

          # The URL contains the stack token, so it is never echoed. `--silent`
          # also suppresses curl's own error output, which would include the URL.
          if ! http_code=$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --max-time 30 --request POST "$PORTAINER_WEBHOOK_URL"); then
            http_code='000'
          fi

          echo "Portainer webhook responded with HTTP ${http_code}"

          case "$http_code" in
            2??) echo "Redeploy requested." ;;
            *) echo "::error::Portainer webhook failed (HTTP ${http_code})." && exit 1 ;;
          esac
